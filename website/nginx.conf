server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the host and port of the request when adding a trailing slash.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # The build puts a content hash in these file names, so they never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
