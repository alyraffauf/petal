  <path fill="#ac548c" d="M10 1h4v1h1v3h-1v3h-1v2h-3V7H9V3h1z"/>
  <path fill="#ffb3d7" d="M10 2h3v3h-1v2h-1V5h-1z"/>
  <!-- The side sepals sit behind the broad wings. -->
  <path fill="#773e77" d="M7 11h4v3h-1v2H9v2H7v2H4v-1H3v-3h1v-2h2v-2h1z M14 11h3v1h2v2h2v2h1v3h-1v1h-3v-1h-2v-2h-1v-2h-1z"/>
  <path fill="#cf72a7" d="M7 14h2v2H7v2H5v-2h1v-1h1z M16 14h2v1h2v2h1v1h-2v-1h-2v-2h-1z"/>
  <!-- Wings turn inward, leaving a deep notch on either side of the crown. -->
  <path fill="#a64d83" d="M3 4h4v1h2v2h1v1h1v2h1v3h-2v1H7v1H4v-1H2v-2H1V7h1V5h1z"/>
