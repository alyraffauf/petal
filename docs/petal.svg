  <path fill="#a64d83" d="M17 3h4v1h1v2h1v5h-1v2h-2v1h-3v-1h-3v-1h-2v-3h1V7h2V5h1V4h1z"/>
  <path fill="#ff9bc5" d="M17 4h4v2h1v4h-1v2h-4v-1h-3V9h1V7h1V5h1z"/>
