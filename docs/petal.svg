<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 24 24" shape-rendering="crispEdges" role="img" aria-labelledby="title">
  <title id="title">Petal, a pink pixel orchid with a gold throat</title>
